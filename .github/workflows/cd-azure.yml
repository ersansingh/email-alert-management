# .github/workflows/cd-azure.yml
name: CD - Azure

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/azure'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: dedoc22/email-alert-app:${{ github.sha }}

  deploy-to-azure:
    name: Deploy to Azure
    needs: build-and-push
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write' # For OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 'Az CLI login via OIDC'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        id: apply
        # NOTE: You will need to create a terraform environment for Azure
        # working-directory: ./infra/environments/azureprod
        run: |
          echo "Azure Terraform directory not found. Please create one."
          # terraform init
          # terraform apply -auto-approve

      - name: Deploy to AKS
        run: |
          # az aks get-credentials --resource-group <your-rg> --name <your-aks-cluster>
          kubectl create secret generic openrouter-api-key --from-literal=api-key=${{ secrets.OPENROUTER_API_KEY }} --dry-run=client -o yaml | kubectl apply -f -
          sed -e "s|DOCKER_IMAGE_PLACEHOLDER|dedoc22/email-alert-app:${{ github.sha }}|g" kubernetes/deployment-template.yaml | kubectl apply -f -
