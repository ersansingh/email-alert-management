# .github/workflows/cd-aws.yml
name: CD - AWS

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/aws'

jobs:
  deploy-to-aws:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # For OIDC
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import Gemini API Key from Vault
        id: vault-secrets
        uses: hashicorp/vault-action@v3
        with:
          url: https://sample-cluster-public-vault-fb3bb75e.39d22881.z1.hashicorp.cloud:8200
          role: aws-role 
          method: jwt
          namespace: admin
          secrets: |
            secret/data/email-alert GEMINI_API_KEY | GEMINI_API_KEY;

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        id: apply
        working-directory: ./infra/environments/awsprod
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name ai-sre-cluster
          # Create a generic k8s secret for the API key
          kubectl create secret generic gemini-api-key --from-literal=api-key=${{ steps.vault-secrets.outputs.GEMINI_API_KEY }} --dry-run=client -o yaml | kubectl apply -f -
          # You would typically use a templating tool like Helm or Kustomize here
          # For simplicity, we use sed to replace placeholders in a template
          sed -e "s|DOCKER_IMAGE_PLACEHOLDER|dedoc22/email-alert-app:${{ github.sha }}|g" kubernetes/deployment-template.yaml | kubectl apply -f -

