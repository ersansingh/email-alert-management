# .github/workflows/terraform-plan.yml
name: Terraform Plan

on:
  pull_request:
    paths:
      - 'infra/**'

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure GCP Credentials
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Terraform Plan AWS
        id: plan-aws
        working-directory: ./infra/environments/awsprod
        run: |
          terraform init
          terraform plan -no-color

      - name: Terraform Plan GCP
        id: plan-gcp
        working-directory: ./infra/environments/gcpprod
        run: |
          terraform init
          terraform plan -no-color
      
      # This action will add the plan output as a PR comment
      - name: Update PR with plan
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform AWS Plan 📖```
${{ steps.plan-aws.outputs.stdout }}
```
            #### Terraform GCP Plan 📖```
${{ steps.plan-gcp.outputs.stdout }}
````;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
