name: Deploy Infrastructure

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (awsprod or gcpprod)'
        required: true
        default: 'gcpprod'
        type: choice
        options:
          - awsprod
          - gcpprod

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v3
    
    - name: Set Environment Variable
      id: set-env
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "ENV_NAME=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
        else
          # Default to gcpprod for automated main branch pushes
          echo "ENV_NAME=gcpprod" >> $GITHUB_ENV
        fi

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      
    - name: Authenticate to AWS via OIDC
      if: env.ENV_NAME == 'awsprod'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
        aws-region: us-east-1

    - name: Authenticate to GCP via OIDC
      if: env.ENV_NAME == 'gcpprod'
      id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: 'projects/663314858590/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-actions-deployer@ai-learning-495017.iam.gserviceaccount.com'

    - name: Terraform Init
      run: terraform -chdir=infra/environments/${{ env.ENV_NAME }} init
      
    - name: Terraform Plan
      run: terraform -chdir=infra/environments/${{ env.ENV_NAME }} plan
        
    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      run: terraform -chdir=infra/environments/${{ env.ENV_NAME }} apply -auto-approve
