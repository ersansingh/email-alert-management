# .github/workflows/integration-tests.yml
name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  localstack-tests:
    name: Run LocalStack Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest testcontainers[localstack]
          
      - name: Start services
        run: docker-compose -f docker-compose.local.yml up -d --build

      - name: Wait for services to be healthy
        # In a real scenario, you might use a more robust health check
        run: sleep 30 

      - name: Run integration tests
        run: pytest tests/test_integration_localstack.py
